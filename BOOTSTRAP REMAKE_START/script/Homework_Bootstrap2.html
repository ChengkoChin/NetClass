<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--For icons in Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <!-- 2. Making the Navigation Bar-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">

            <!--3. Title and icon-->
            <a class="navbar-brand ms-3" href="#">MovieShopMVC
                <i class="bi-film"></i>
            </a>

            <!--Toggle Button-->
            <button class="navbar-toggler me-3" role="button" data-bs-toggle="collapse" data-bs-target=#navbarDropdown>
                <span class="navbar-toggler-icon"></span>
            </button>

            <!--5. Collapsible content-->
            <div class="collapse navbar-collapse" id="navbarDropdown">
                <!--4. Converting to Navbar-->
                <ul class="navbar-nav">
                    <!--Home-->
                    <li class="nav-item">
                        <a class="nav-link active" href="#" role="button">Home</a>
                    </li>

                    <!-- 1. Dropdown Menu-->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" role="button" href="#" id="genresDropdown" data-bs-toggle="dropdown" aria-exapanded="false">
                            Genres
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Comedy</a></li>
                            <li><a class="dropdown-item" href="#">Drama</a></li>
                            <li><a class="dropdown-item" href="#">Sci-Fi</a></li>
                            <li><a class="dropdown-item" href="#">Horror</a></li>
                            <li><a class="dropdown-item" href="#">Cartoon</a></li>
                            <li><a class="dropdown-item" href="#">Suspense</a></li>
                        </ul>
                    </li>

                    <!--Privacy-->
                    <li class="nav-item">
                        <a class="nav-link" href="#">Privacy</a>
                    </li>
                </ul>

                <!--Login & Register--> <!--Need a new ul since this need to be on the right-->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item me-3">
                        <a class="btn btn-outline-primary" href="#">Login</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="btn btn-outline-primary" href="#">Register</a>
                    </li>
                </ul>
                

            </div>
        </nav>

        <!--Register title-->
        <h2>Register</h2>
        <h4 class="mb-3">User Register Request Form</h4>
        <!--Form Components (e.g: email, password, etc.)-->
        <form action="https://www.google.com" method="post">
            <div class="mb-3">
                <label class="form-label">Email Address</label><br>
                <input class="form-control" type="text" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label><br>
                <input class="form-control" type="password" name="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label><br>
                <input class="form-control" type="password" name="comfirmPass" required>
            </div>
            <div class="mb-3">
                <label class="form-label">First Name</label><br>
                <input class="form-control" type="text" name="Fname" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Last Name</label><br>
                <input class="form-control" type="text" name="Lname" required>
            </div>

            <div class="mb-3">
                <button class="btn btn-primary" type="submit">Create Account</button> 
            </div>
        
        </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
