<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework_Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Link to access the icons in Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-4">
            <!--TITLE & ICON-->
            <a class="navbar-brand ps-3" href="#">Movie Shop
                <i class="bi bi-film"></i>
            </a>

            <!--TOGGLE BUTTON-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=#navbarDropdown>
                <span class="navbar-toggler-icon"></span>
            </button>

            <!--COLLAPSIBLE CONTENT-->
            <div class="collapse navbar-collapse" id="navbarDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">

                        <!--DROPDOWM MENU-->
                        <!--dropdown-toggle adds the caret icon-->
                        <a class="nav-link dropdown-toggle" href="#" id="genresDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span>GENRES</span>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="genresDropdown">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Comedy</a></li>
                            <li><a class="dropdown-item" href="#">Drama</a></li>
                            <li><a class="dropdown-item" href="#">Sci-Fi</a></li>
                            <li><a class="dropdown-item" href="#">Horror</a></li>
                            <li><a class="dropdown-item" href="#">Cartoon</a></li>
                            <li><a class="dropdown-item" href="#">Suspense</a></li>
                        </ul>

                    </li>
                </ul>

                <!--Adding Right-Aligned buttons-->
                <!--me pushes items to the left
                    ms pushes items to the right-->
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item">
                        <a class="nav-link" href="#">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link me-3" href="#">Register</a>
                    </li>
                </ul>
            </div>

        </div> 

        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow col-12 col-sm-6 col-md-3">
                <h3 class="text-center mb-4">Login</h3>
                <form action="https://www.google.com/" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label><br>
                        <input class="form-control" type="text" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label><br>
                        <input class="form-control" type="password" name="password">
                    </div>

                    <!-- d-grid is to expand the login button to the fullest-->
                    <div class="d-grid">
                        <button class="btn btn-primary" type="submit"> Login
                            <i class="bi-box-arrow-in-right ms-1"></i> 
                        </button> 
                    </div>
                </form>
            </div>
        </div>

    </div> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
